<!DOCTYPE html>
<html lang="el">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1d73a3">
    <meta name="description" content="Χάρτης των μονάδων του Πανελλήνιου Σχολικού Δικτύου.">
    <title>Χάρτης Μονάδων ΠΣΔ</title>

    <link rel="stylesheet" href="assets/libs/leaflet/leaflet.css">
    <link rel="stylesheet" href="assets/libs/leaflet-markercluster/MarkerCluster.css">
    <link rel="stylesheet" href="assets/libs/leaflet-markercluster/MarkerCluster.Default.css">
    <link rel="stylesheet" href="assets/css/app.css">
    <link rel="stylesheet" href="assets/css/app_embed.css">
    <link rel="apple-touch-icon" sizes="76x76" href="assets/img/favicon-76.png">
    <link rel="apple-touch-icon" sizes="120x120" href="assets/img/favicon-120.png">
    <link rel="apple-touch-icon" sizes="152x152" href="assets/img/favicon-152.png">
    <link rel="icon" sizes="196x196" href="assets/img/favicon-196.png">
    <link rel="icon" type="image/x-icon" href="assets/img/favicon.ico">
  </head>

  <body>
    <svg class="icon-defs" aria-hidden="true" focusable="false">
      <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    </svg>

    <div id="container">
      <div id="map" data-testid="map"></div>
    </div>

    <dialog class="modal" id="featureModal" aria-labelledby="feature-title">
      <form method="dialog" class="modal-head">
        <h2 id="feature-title" data-testid="unit-title"></h2>
        <button class="icon-btn" value="close"><svg class="icon" aria-hidden="true"><use href="#i-close"></use></svg><span class="sr-only">Κλείσιμο</span></button>
      </form>
      <div class="modal-body" id="feature-info" data-testid="unit-info"></div>
      <form method="dialog" class="modal-foot">
        <button class="btn" value="close">Κλείσιμο</button>
      </form>
    </dialog>

    <script src="assets/libs/leaflet/leaflet-1.6.0.min.js"></script>
    <script src="assets/libs/leaflet-markercluster/leaflet.markercluster-1.4.1.min.js"></script>
    <script>window.MapsConfigOverride = { embed: true, showUnitSites: false };</script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/lookups.js"></script>
    <script src="assets/js/multiselect.js"></script>
    <script src="assets/js/helper.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
